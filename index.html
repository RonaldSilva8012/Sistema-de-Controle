<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="img/icon.jpg">
    <title>Acesso ao Sistema</title>
</head>
<body>

    <div class="banner">
        <video autoplay muted loop id="video-fundo">
            <source src="img/rota-vermelha.mp4" type="video/mp4">
            Seu navegador não suporta vídeos em HTML5.
        </video>

    <main class="container">
        <!-- <div class="user-avatar-container">
            <img src="img/usuario.png" alt="usuario" width="40px">
        </div> -->

        <h2 id="titulo-form" style="@import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap');">TRANSPORED</h2>
        <form id="form-login" onsubmit="return false;">
            
            <div class="form-group" id="grupo-nome">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo">
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="exemplo@dominio.com" required>
            </div>

            <div class="form-group" style="display: flex; gap: 10px;">
                <button type="button" id="btn-solicitar" class="botao-calcular">Solicitar Acesso</button>
                <button type="button" id="btn-entrar" class="botao-calcular">Entrar</button>
            </div>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
